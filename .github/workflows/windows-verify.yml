name: Windows Verify

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/**'
  workflow_dispatch:

jobs:
  build-and-verify:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        # --force: 项目同时声明了 koffi 的多平台包（win32-x64 + darwin-arm64），
        # npm ci 按当前平台校验会报 EBADPLATFORM；--force 跳过该校验
        # （运行时只加载匹配平台的二进制，无害）
        run: npm ci --legacy-peer-deps --force

      - name: Build Windows package
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        # --publish never: 只构建，不尝试发布到 GitHub Releases（避免需要 GH_TOKEN）
        run: npx electron-builder --win nsis --x64 --publish never

      - name: Launch app and wait for DSH service
        shell: pwsh
        run: |
          $exe = "dist\win-unpacked\DSH Desktop.exe"
          if (!(Test-Path $exe)) { throw "exe not found: $exe" }
          Start-Process -FilePath $exe
          $ready = $false
          for ($i = 0; $i -lt 90; $i++) {
            Start-Sleep -Seconds 1
            try {
              $r = Invoke-WebRequest -Uri "http://127.0.0.1:3080" -UseBasicParsing -TimeoutSec 3
              if ($r.StatusCode -eq 200) { $ready = $true; Write-Host "DSH service UP after $($i+1)s"; break }
            } catch {}
          }
          if (!$ready) { throw "DSH service did not become ready on port 3080" }

      - name: Verify service log (builtin dsh, no errors)
        shell: pwsh
        run: |
          $log = "$env:USERPROFILE\.dsh-desktop\dsh-web.log"
          if (!(Test-Path $log)) { throw "log not found: $log" }
          $content = Get-Content $log -Raw
          Write-Host "===== dsh-web.log ====="
          Write-Host $content
          if ($content -notmatch "source=builtin") { throw "builtin dsh was NOT used" }
          if ($content -match "EADDRINUSE") { throw "port 3080 conflict detected" }
          if ($content -match "Cannot find the native Koffi") { throw "koffi native module missing" }
          if ($content -match "--expose-internals is required") { throw "HMR expose-internals missing" }
          if ($content -match "directory picker failed") { throw "directory picker failed" }
          Write-Host "LOG OK: builtin dsh, no known errors"

      - name: Verify package integrity (parity with macOS)
        shell: pwsh
        run: |
          $app = "dist\win-unpacked\resources\app"
          $errors = @()

          # 1. builtin dsh
          if (!(Test-Path "$app\node_modules\@deepseek-ai\dsh\lib\bin.js")) { $errors += "builtin dsh missing" }

          # 2. koffi win32-x64 native module
          if (!(Test-Path "$app\node_modules\@koromix\koffi-win32-x64\win32_x64\koffi.node")) { $errors += "koffi win32-x64 missing" }

          # 2b. sharp win32-x64 (attachment image processing) with libvips DLL
          if (!(Test-Path "$app\node_modules\@img\sharp-win32-x64\lib\sharp-win32-x64-*.node")) { $errors += "sharp win32-x64 missing" }
          if (!(Test-Path "$app\node_modules\@img\sharp-win32-x64\lib\libvips-42.dll")) { $errors += "sharp libvips DLL missing" }

          # 2c. node-addon-require-builtin win32-x64-msvc (loader's builtin require)
          if (!(Test-Path "$app\node_modules\node-addon-require-builtin-win32-x64-msvc")) { $errors += "node-addon-require-builtin win32 missing" }

          # 2d. ripgrep win32-x64 (glob/grep tools)
          if (!(Test-Path "$app\node_modules\@vscode\ripgrep-win32-x64\bin\rg.exe")) { $errors += "ripgrep win32-x64 missing" }

          # 2e. fs-search patch applied (resolveRgPath retry fix)
          $fsSearch = Get-Content "$app\node_modules\@deepseek-ai\dsh-tool-fs-search\lib\index.js" -Raw
          if ($fsSearch -notmatch "failed to resolve packaged ripgrep binary") { $errors += "fs-search resolveRgPath patch NOT applied" }

          # 3. @deepseek-ai package count (expect 195)
          $count = (Get-ChildItem "$app\node_modules\@deepseek-ai" -Directory).Count
          if ($count -lt 190) { $errors += "@deepseek-ai package count low: $count" }

          # 4. browse picker patch (dual-face: host + client UI)
          $patch = Get-Content "$app\src\browse-picker.patch.yml" -Raw
          if ($patch -notmatch "dsh-host-directory-picker-browse") { $errors += "patch missing host browse" }
          if ($patch -notmatch "dsh-client-ui-directory-picker-browse") { $errors += "patch missing client UI browse" }

          # 5. main.js critical logic
          $main = Get-Content "$app\src\main.js" -Raw
          if ($main -notmatch "expose-internals") { $errors += "main.js missing --expose-internals" }
          if ($main -notmatch "browse-picker.patch.yml") { $errors += "main.js missing picker patch reference" }

          if ($errors.Count -gt 0) {
            throw "Package integrity check FAILED:`n" + ($errors -join "`n")
          }
          Write-Host "PACKAGE INTEGRITY OK (builtin dsh / koffi / picker patch / main.js)"

      - name: Diagnose native picker worker
        shell: pwsh
        run: |
          node diag-worker.js "dist\win-unpacked\DSH Desktop.exe" "dist\win-unpacked\resources\app\node_modules\@deepseek-ai\dsh-host-directory-picker-native\lib\worker.cjs" 2>&1 | Tee-Object -FilePath diag-worker.txt
          Write-Host "===== DIAG OUTPUT SAVED ====="

      - name: Stop app
        shell: pwsh
        run: |
          taskkill /F /T /IM "DSH Desktop.exe" 2>$null
          Write-Host "app stopped"

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: dsh-desktop-windows
          path: dist/*.exe
          if-no-files-found: error

      - name: Upload worker diagnostic
        uses: actions/upload-artifact@v4
        with:
          name: worker-diagnostic
          path: diag-worker.txt
          if-no-files-found: warn
